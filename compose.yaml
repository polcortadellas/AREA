name: area

x-server: &server
  build: ./server
  image: area-server
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &server-env
    DATABASE_URL: postgres://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/${POSTGRES_DB:?copy .env.example to .env}?sslmode=disable
    REDIS_URL: redis://:${REDIS_PASSWORD:?copy .env.example to .env}@redis:6379/0
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"

services:
  # Server roles
  api:
    <<: *server
    environment:
      <<: *server-env
      ROLE: api
      API_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
      JWT_TTL: ${JWT_TTL:-1h}
      SMTP_FROM: ${SMTP_FROM:-AREA <no-reply@area.local>}
      WEB_BASE_URL: ${PUBLIC_WEB_URL:-http://localhost:8081}
    ports:
      - "${API_PORT:-8080}:8080"

  scheduler:
    <<: *server
    environment:
      <<: *server-env
      ROLE: scheduler

  worker:
    <<: *server
    environment:
      <<: *server-env
      ROLE: worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}

  # Infrastructure
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # Clients
  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:8080"

  android-builder:
    build: ./mobile
    # The Android NDK and aapt2 only exist for x86_64 Linux
    platform: linux/amd64
    restart: "no"
    volumes:
      - ./dist:/out

volumes:
  postgres-data:
  redis-data:
