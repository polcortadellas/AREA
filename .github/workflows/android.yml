name: Android APK

# The APK build takes several minutes, so it only runs when the mobile client changes.
on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"

permissions:
  contents: read

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t area-android-builder ./mobile
