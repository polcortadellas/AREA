name: CI y copia a privado

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    if: github.repository == 'polcortadellas/AREA'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests de prueba
        run: |
          echo "Tests de prueba: OK"

  copiar:
    if: github.repository == 'polcortadellas/AREA'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copiar al repo privado
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PRIVATE_REPO: polcortadellas/G-YEP-500-BAR-5-1-area-3
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git push --force "git@github.com:${PRIVATE_REPO}.git" refs/heads/main:refs/heads/main